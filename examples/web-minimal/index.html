<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>ggez</title>
    <style>
      body { margin: 0; background: #111; }
      canvas { display: block; margin: 0 auto; }
    </style>
  </head>
  <body>
    <script type="module">
      // 1. Audio only: browsers keep audio suspended until a user gesture. This resumes it on
      //    the first one and mirrors the state to `window.__ggezAudioState`, which backs
      //    `ctx.audio.state()`. It must run before the wasm module loads, hence the dynamic
      //    import below.
      const Original = window.AudioContext;
      window.AudioContext = class extends Original {
        constructor(...args) {
          super(...args);
          const sync = () => (window.__ggezAudioState = this.state);
          sync();
          this.addEventListener("statechange", sync);
          const unlock = () => this.resume().catch(() => {});
          for (const ev of ["pointerdown", "keydown", "touchstart"]) {
            addEventListener(ev, unlock, { capture: true, passive: true, once: true });
          }
        }
      };

      // 2. Resources: a zip of the resources directory, which ggez mounts as its
      //    filesystem root. Skip this if you embed resources with `add_zipfile_bytes`.
      const zip = await fetch("./resources.zip");
      window.__GGEZ_RESOURCES_ZIP__ = new Uint8Array(await zip.arrayBuffer());

      // 3. Load the wasm-bindgen output. `init()` instantiates the module and runs `main()`,
      //    which attaches a canvas (id `ggez-body`) to <body> and starts the game.
      const { default: init } = await import("./pkg/game.js");
      await init();
    </script>
  </body>
</html>
